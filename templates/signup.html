{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Mind Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* A slightly cooler background */
        }
        .font-brand {
            font-family: 'Dancing Script', cursive;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-sm w-full space-y-8">
        <!-- Logo -->
        <div class="flex justify-center">
            <div class="bg-white p-3 px-6 rounded-full flex items-center space-x-3 shadow-md">
                <!-- Brain Icon SVG -->
                <svg class="w-8 h-8 text-slate-800" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-brain-circuit"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A3 3 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A3 3 0 1 1 12 18Z"/><path d="M15 13a3 3 0 1 0-6 0"/><path d="M12 18v2"/><path d="M12 3V1"/><path d="m4.5 4.5 1 1"/><path d="m18.5 4.5-1 1"/><path d="m7.5 21 1-1"/><path d="m16.5 21-1-1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="16" r="1"/><circle cx="12" cy="8" r="1"/></svg>
                <h1 class="font-brand text-4xl text-slate-800">Safe Mind</h1>
            </div>
        </div>
        
        <!-- Back to login -->
        <div class="px-2">
            <a href="index.html" class="flex items-center space-x-2 text-slate-600 font-medium hover:text-black transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span>Back to Login</span>
            </a>
        </div>


        <!-- Form Area -->
        <div class="relative pt-4">
             <img src="Group 6.png" 
                 alt="Floral brain illustration" 
                 class="absolute inset-x-0 top-0 w-full h-full object-contain opacity-10 z-0"
                 onerror="this.onerror=null;this.src='https://placehold.co/400x400/e0e8f0/a28d95?text=Image+Missing';">
            
            <form action="#" class="relative z-10 space-y-4">
                <!-- Email Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </div>
                    <input type="email" placeholder="Email" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200/80 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7fccc1] focus:border-transparent transition placeholder-gray-500">
                </div>
                
                <!-- Password Input -->
                <div class="relative">
                     <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <input type="password" placeholder="Password" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200/80 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7fccc1] focus:border-transparent transition placeholder-gray-500">
                </div>

                <!-- Confirm Password Input -->
                <div class="relative">
                     <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <input type="password" placeholder="Confirm Password" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200/80 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7fccc1] focus:border-transparent transition placeholder-gray-500">
                </div>

                 <!-- Phone Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                       <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-gray-400"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    </div>
                    <input type="tel" placeholder="Phone" class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200/80 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#7fccc1] focus:border-transparent transition placeholder-gray-500">
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-[#88d4c3] text-gray-800 font-semibold py-3 rounded-xl shadow-lg hover:bg-[#7ac1b3] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#88d4c3] transition-colors">
                        Sign Up
                    </button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
