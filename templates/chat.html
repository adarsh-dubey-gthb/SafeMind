{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Mind - MindMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e9eff5;
        }
        .font-brand {
            font-family: 'Dancing Script', cursive;
        }
        .chat-bg {
            background-image: url('https://placehold.co/600x800/ffffff/d1e0e0?text=');
            background-size: cover;
            background-position: center;
        }
        .chat-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://i.imgur.com/j4n2aYt.png'); /* Faint floral image */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-[#8aa3a1] text-white shadow-md">
        <nav class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a href="home.html" class="flex items-center space-x-2">
                 <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A3 3 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A3 3 0 1 1 12 18Z"/><path d="M15 13a3 3 0 1 0-6 0"/></svg>
                <h1 class="font-brand text-3xl">Safe Mind</h1>
            </a>
            <a href={% url 'home1' %} class="font-semibold hover:text-gray-200 transition-colors">Back</a>
        </nav>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col">
        <div class="relative flex-grow flex flex-col p-4 bg-white/70 rounded-2xl shadow-inner border border-gray-200">
            <!-- Title Pill -->
            <div class="absolute -top-5 left-1/2 -translate-x-1/2">
                <div class="bg-white px-6 py-2 rounded-full shadow-md">
                    <h2 class="font-semibold text-slate-700">MindMate</h2>
                </div>
            </div>
            
            <!-- Chat background -->
            <div class="relative flex-grow rounded-lg overflow-hidden chat-bg">
                <!-- Messages will go here -->
            </div>
        </div>
    </main>

    <!-- Footer Input -->
    <footer class="bg-[#8aa3a1] py-3">
        <div class="container mx-auto px-4">
            <div class="relative">
                <input type="text" placeholder="Start conversation" class="w-full pl-4 pr-24 py-3 bg-white rounded-full shadow-md focus:outline-none focus:ring-2 focus:ring-white/80 transition placeholder-gray-500">
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 space-x-2">
                    <button class="w-8 h-8 flex items-center justify-center text-slate-600 hover:text-black transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button class="w-8 h-8 flex items-center justify-center text-slate-600 hover:text-black transition">
                       <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
